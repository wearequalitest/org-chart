<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Org Chart - Premium Dashboard UI</title>

    <style>
      /* Imported Orbitron for the creative Role Badges */
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@700;900&display=swap");
    </style>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/dom-to-image-more@2.8.0/dist/dom-to-image-more.min.js"></script>
  </head>
  <body>
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
      <div class="bg-moving-grid"></div>
      <div
        class="floating-shape orb-1 w-80 h-80 bg-gradient-to-br from-white/30 to-blue-400/30 rounded-full blur-2xl"
        style="top: 5%; left: 10%"
      ></div>
      <div
        class="floating-shape orb-2 w-40 h-40 bg-gradient-to-br from-white/30 to-red-400/30 rounded-full blur-2xl"
        style="top: 90%; left: 90%"
      ></div>
      <div
        class="floating-shape orb-3 w-60 h-60 bg-gradient-to-br from-white/30 to-green-400/30 rounded-full blur-2xl"
        style="top: 50%; left: 50%"
      ></div>
    </div>

    <div id="torch"></div>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
